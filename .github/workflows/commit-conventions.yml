name: Check commit conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A pull request may cancel its own earlier run: the next one re-checks the
# whole range. A push may not — it is checked over the range it pushed, so
# cancelling it would leave those commits unchecked by anything. Give each push
# a group of its own instead.
concurrency:
  group: >-
    commit-conventions-${{ github.event.pull_request.number
      || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  # A public repository may not call a workflow_call workflow that lives in a
  # private one, so this calls the qoax-githooks action directly instead of
  # going through qoax-reusables.
  commit-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # or there is no range to enumerate
      - uses: qoax-community/qoax-githooks@v1
